name: haber

on:
  # Kalite denemesi bitene kadar zamanlama kapali (elle calistirilabilir):
  # schedule:
  #   - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

# Aynı anda tek koşu; yenisi sıraya girer ve eskisini kesmez.
concurrency:
  group: haber-hatti
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tur:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.0"
      - name: Haber turu
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HABER_YUKLE_ANAHTARI: ${{ secrets.HABER_YUKLE_ANAHTARI }}
          SUPABASE_FN_URL: ${{ secrets.SUPABASE_FN_URL }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YEDEK_MODEL: ${{ vars.YEDEK_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GORSELSIZ_YAYIN: ${{ vars.GORSELSIZ_YAYIN }}
          GUVENILIR_KAYNAKLAR: ${{ vars.GUVENILIR_KAYNAKLAR }}
          TUR_BASINA_EN: ${{ vars.TUR_BASINA_EN }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          ALAN_KOTALARI: ${{ vars.ALAN_KOTALARI }}
          ALAN_ARDA_ARDA_UST: ${{ vars.ALAN_ARDA_ARDA_UST }}
          OZEL_ISLER: ${{ vars.OZEL_ISLER }}
          OZEL_KOTALARI: ${{ vars.OZEL_KOTALARI }}
          OZEL_SAAT: ${{ vars.OZEL_SAAT }}
          OZEL_TUR_UST: ${{ vars.OZEL_TUR_UST }}
          OZEL_CAGRI_UST: ${{ vars.OZEL_CAGRI_UST }}
        run: node hat.mjs
